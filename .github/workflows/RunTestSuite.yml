name: LittleDarwin Test Suite

on:
  push:
    branches: [ master, quick-quicker ]
  pull_request:
    branches: [ master, quick-quicker ]

jobs:
  # ------------------------------------------------------------------
  # Unit tests (fast): platform + Python-version matrix
  # ------------------------------------------------------------------
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@v2
    - name: Setup Java JDK
      uses: actions/setup-java@v1.4.3
      with:
        java-version: 1.8
        java-package: jdk
        architecture: x64
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
    - name: Run unit tests
      run: |
        pip install --upgrade pytest
        pytest -l --verbosity=3 --ignore=tests/test_IntegrationProjects.py

  # ------------------------------------------------------------------
  # Integration tests: run MediumDarwin on real toy projects
  # (Maven / Gradle / Ant) x 4 configs each, in parallel.
  # ------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v2

    - name: Setup Java JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install system deps (Maven + Ant)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq maven ant

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        pip install pytest

    - name: Run integration tests
      run: |
        python -m pytest tests/test_IntegrationProjects.py -v -s
      env:
        PYTHONPATH: .
